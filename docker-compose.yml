services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catatannegeri_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://catatannegeri_user:secure_pg_password_here@postgres:5432/catatannegeri?schema=public
      - JWT_SECRET=catatan-negeri-secure-production-jwt-token-secret-change-me
      - NEXT_PUBLIC_SITE_URL=https://catatannegeri.com
      - NEXT_PUBLIC_SITE_NAME=Catatan Negeri
      - NEXT_PUBLIC_SITE_TAGLINE=Portal Berita & Informasi Digital Indonesia
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: catatannegeri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catatannegeri_user
      POSTGRES_PASSWORD: secure_pg_password_here
      POSTGRES_DB: catatannegeri
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catatannegeri_user -d catatannegeri"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

